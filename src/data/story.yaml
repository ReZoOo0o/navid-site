# The years BEFORE the road. The ride itself is told in `chapters` above; this
# is the working life it came out of, and it is deliberately terse so that the
# two never say the same thing twice.
timeline:
  - id: tl-2015
    when: { en: "2015", fa: "۲۰۱۵" }
    body: { en: "Documentary film and photography begin, in Shiraz.", fa: "مستندسازی و عکاسی، از شیراز، آغاز می‌شود." }
  - id: tl-tours
    when: { en: "The tour years", fa: "سال‌های تور" }
    body: { en: "Leading tours across Iran for travellers arriving from abroad — later for Iranian groups in Iran and in Georgia.", fa: "تورلیدری در سراسر ایران برای مسافرانی که از خارج می‌آمدند — و بعدتر برای گروه‌های ایرانی در ایران و گرجستان." }
  - id: tl-countries
    when: { en: "Thirteen countries", fa: "سیزده کشور" }
    body: { en: "Lived and worked in — cooking professionally, training baristas, guiding.", fa: "زندگی و کار در سیزده کشور — آشپزی حرفه‌ای، آموزش باریستا، راهنمایی سفر." }

