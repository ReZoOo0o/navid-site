# Navid's site — nginx on the site's origin box, behind Cloudflare.
#
# Port 8443: one of the ports Cloudflare's proxy can reach an origin on over
# HTTPS. An Origin Rule on the zone rewrites the destination port to it, so
# visitors still arrive on 443 at the edge.
#
# The firewall refuses 8443 from everything except Cloudflare's published IP
# ranges, resynced weekly out of band. This config trusts CF-Connecting-IP only
# because of that: without the firewall, a spoofed header would be believed.
#
# Response headers live in /etc/nginx/snippets/navid-security-headers.conf and
# are included at server level AND in every location that declares an
# add_header, because nginx replaces rather than merges inherited add_header
# sets. Read that file before adding a location here.

# Anything that reaches this port without a matching Host is not Cloudflare.
# HTTP/2 rides on the listen directive rather than the standalone directive
# of nginx 1.25+: Ubuntu 24.04 ships nginx 1.24, which rejects that one. It is
# a socket-wide flag, so this one listen line covers the vhost below as well.
server {
  listen 8443 ssl http2 default_server;
  server_name _;
  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  return 444;
}

server {
  listen 8443 ssl;
  server_name REPLACE_WITH_DOMAIN www.REPLACE_WITH_DOMAIN;

  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  include /etc/nginx/conf.d/cloudflare-realip.conf;

  root /var/www/navid;
  index index.html;

  include /etc/nginx/snippets/navid-security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Every location below that sets its own Cache-Control must re-include the
  # header snippet: its add_header REPLACES the server-level set, it does not
  # add to it. Forget the include and that path ships with no CSP, no
  # X-Frame-Options and no HSTS — a .svg served same-origin runs inline script,
  # and the pdf is a top-level document a visitor opens directly.

  # hashed assets are immutable — cache them forever
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/navid-security-headers.conf;
    access_log off;
  }
  location ~* \.(woff2|jpg|jpeg|png|webp|avif|svg)$ {
    expires 30d;
    add_header Cache-Control "public";
    include /etc/nginx/snippets/navid-security-headers.conf;
  }
  # html must revalidate so a deploy is visible immediately.
  # `expires -1` and NOT `add_header Cache-Control "no-cache"`: the add_header
  # form would replace the inherited set and strip all six headers. `expires` is
  # a different config field, so this location inherits them and needs no
  # include of its own.
  location ~* \.html$ { expires -1; }
  location = /navid-media-kit.pdf {
    add_header Cache-Control "public, max-age=3600";
    include /etc/nginx/snippets/navid-security-headers.conf;
  }

  location /api/contact {
    proxy_pass http://127.0.0.1:8787;
    # real_ip has already rewritten $remote_addr to the visitor; the handler
    # prefers cf-connecting-ip, so pass that through as well.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header Host $host;
  }

  location / { try_files $uri $uri/ /404.html; }
  error_page 404 /404.html;

  location ~ /\.  { deny all; }   # no dotfiles, ever
}
