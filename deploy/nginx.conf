# Navid media kit — nginx for a static Astro build on Reza's own VPS.
# Assumes: build output at /var/www/navid, contact endpoint on 127.0.0.1:8787.
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name REPLACE_WITH_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /var/www/navid;
  index index.html;

  # security headers — no external origins are used, so the CSP can be strict
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
  # brotli on;  # uncomment if ngx_brotli is built in

  # hashed assets are immutable — cache them forever
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
  location ~* \.(woff2|jpg|jpeg|png|webp|avif|svg)$ {
    expires 30d;
    add_header Cache-Control "public";
  }
  # html must revalidate so a deploy is visible immediately
  location ~* \.html$ { add_header Cache-Control "no-cache"; }
  location = /navid-media-kit.pdf { add_header Cache-Control "public, max-age=3600"; }

  location /api/contact {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
  }

  location / { try_files $uri $uri/ /404.html; }
  error_page 404 /404.html;

  location ~ /\.  { deny all; }   # no dotfiles, ever
}
